   name: Green Taxi V4 CI

   on:
     push:
       branches: [main]
     workflow_dispatch:

   permissions:
     id-token: write
     contents: read

   env:
     AWS_REGION: eu-north-1
     ECR_REPOSITORY: green-taxi-v4-api
     ECS_CLUSTER: green-taxi-v4-cluster
     ECS_SERVICE: green-taxi-v4-api-service

   jobs:
     test-build-push:
       runs-on: ubuntu-latest
       timeout-minutes: 60

       steps:
         - name: Get the code
           uses: actions/checkout@v7

         - name: Set up Python
           uses: actions/setup-python@v7
           with:
             python-version: "3.14"
             cache: pip
             cache-dependency-path: requirements-api.txt

         - name: Install packages
           run: pip install -r requirements-api.txt pytest httpx "dvc[s3]"

         - name: Log in to AWS (OIDC)
           uses: aws-actions/configure-aws-credentials@v6
           with:
             role-to-assume: arn:aws:iam::010928224571:role/green-taxi-v4-github-actions
             aws-region: ${{ env.AWS_REGION }}

         - name: Verify AWS identity
           run: aws sts get-caller-identity

         - name: Download the model from DVC
           run: dvc pull models/best_model.joblib

         - name: Run tests
           run: pytest -v

         - name: Log in to ECR
           id: ecr
           uses: aws-actions/amazon-ecr-login@v2

         - name: Build image
           id: build-image
           run: |
             set -euo pipefail
             IMAGE="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
             IMAGE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
             docker build -t "$IMAGE:$IMAGE_TAG" .
             echo "image=$IMAGE:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

         - name: Smoke test container
           run: |
             set -euo pipefail
             docker run -d --name api -p 8000:8000 "${{ steps.build-image.outputs.image }}"
             READY=false
             for i in $(seq 1 30); do
               if curl -fsS http://localhost:8000/health; then READY=true; break; fi
               sleep 2
             done
             if [ "$READY" != "true" ]; then docker logs api; docker rm -f api; exit 1; fi
             curl -fsS -X POST http://localhost:8000/predict \
               -H "Content-Type: application/json" \
               -d '{"vendorid":2,"rate_code":1,"Pickup_longitude":-73.95,"Pickup_latitude":40.75,"Dropoff_longitude":-73.98,"Dropoff_latitude":40.76,"Passenger_count":1,"Trip_distance":3.5,"Trip_type":1,"pickup_hour":14,"pickup_weekday":2}'
             docker rm -f api

         - name: Push image to ECR
           run: docker push "${{ steps.build-image.outputs.image }}"
         
         - name: Render ECS task definition
           id: task-def
           uses: aws-actions/amazon-ecs-render-task-definition@v1
           with:
             task-definition: ecs-task-definition.json
             container-name: green-taxi-v4-api
             image: ${{ steps.build-image.outputs.image }}

         - name: Deploy to ECS
           uses: aws-actions/amazon-ecs-deploy-task-definition@v2
           with:
             task-definition: ${{ steps.task-def.outputs.task-definition }}
             service: ${{ env.ECS_SERVICE }}
             cluster: ${{ env.ECS_CLUSTER }}
             wait-for-service-stability: true
             wait-max-delay-seconds: 15