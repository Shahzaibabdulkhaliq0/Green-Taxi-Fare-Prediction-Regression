AWSTemplateFormatVersion: "2010-09-09"
Description: Isolated Green Taxi live app infrastructure. Does not modify V4 resources.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0718eb443305ba44d
  PublicSubnetA:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-00d33fb36d5665dcb
  PublicSubnetB:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-03fe443e6ba7edf83
  PublicSubnetC:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-01a9ab3d7c3d26d87
  GitHubRepository:
    Type: String
    Default: Shahzaibabdulkhaliq0/Green-Taxi-Fare-Prediction-Regression

Resources:
  FrontendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: green-taxi-live-frontend
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: green-taxi-live-cluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: green-taxi-live-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: green-taxi-live-github-actions
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: green-taxi-live-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushLiveImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !GetAtt FrontendRepository.Arn
              - Sid: PullDvcModel
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: arn:aws:s3:::green-taxi-v4-dvc-010928224571/dvc/*
              - Sid: ListDvcBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: arn:aws:s3:::green-taxi-v4-dvc-010928224571
                Condition:
                  StringLike:
                    s3:prefix: dvc/*
              - Sid: EcsDeployment
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                Resource: "*"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to Green Taxi live frontend ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: green-taxi-live-alb-sg

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only ALB can reach the Streamlit frontend container
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: green-taxi-live-task-sg

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/green-taxi-live-api
      RetentionInDays: 7

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/green-taxi-live-frontend
      RetentionInDays: 7

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: green-taxi-live-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
        - !Ref PublicSubnetC
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup

  FrontendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: green-taxi-live-tg
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8501
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /_stcore/health
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref FrontendTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn:
      - ApiLogGroup
      - FrontendLogGroup
    Properties:
      Family: green-taxi-live-app
      Cpu: "1024"
      Memory: "4096"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: green-taxi-live-api
          Image: 010928224571.dkr.ecr.eu-north-1.amazonaws.com/green-taxi-v4-api:8368ead195ca25a4bdcace640743ae56802beab1-43578691039-1
          Essential: true
          Cpu: 768
          Memory: 3072
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/green-taxi-live-api
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD
              - python
              - -c
              - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
        - Name: green-taxi-live-frontend
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/green-taxi-live-frontend:bootstrap
          Essential: true
          Cpu: 256
          Memory: 1024
          DependsOn:
            - ContainerName: green-taxi-live-api
              Condition: HEALTHY
          Environment:
            - Name: API_BASE_URL
              Value: http://127.0.0.1:8000
          PortMappings:
            - ContainerPort: 8501
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/green-taxi-live-frontend
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)\""
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
    Properties:
      ServiceName: green-taxi-live-service
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 0
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnetA
            - !Ref PublicSubnetB
            - !Ref PublicSubnetC
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: green-taxi-live-frontend
          ContainerPort: 8501
          TargetGroupArn: !Ref FrontendTargetGroup

Outputs:
  ApplicationUrl:
    Description: HTTP URL for the Streamlit application (HTTPS requires a domain and ACM certificate).
    Value: !Sub http://${LoadBalancer.DNSName}
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
  EcsClusterName:
    Value: !Ref Cluster
  EcsServiceName:
    Value: !GetAtt Service.Name
  FrontendEcrRepositoryUri:
    Value: !GetAtt FrontendRepository.RepositoryUri
